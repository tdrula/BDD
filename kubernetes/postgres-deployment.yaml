apiVersion: apps/v1
kind: Deployment
metadata:
    name: postgres
    namespace: gfp
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: postgres
    template:
        metadata:
            labels:
                app: postgres
        spec:
            containers:
                - name: postgres
                  image: postgres:16-alpine
                  ports:
                      - containerPort: 5432
                  envFrom:
                      - secretRef:
                            name: postgres-secret
                  volumeMounts:
                      - name: postgres-data
                        mountPath: /var/lib/postgresql/data
                        subPath: pgdata
            volumes:
                - name: postgres-data
                  persistentVolumeClaim:
                      claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
    name: postgres
    namespace: gfp
spec:
    selector:
        app: postgres
    ports:
        - port: 5432
          targetPort: 5432
