services:
  postgres:
    image: postgres:16-alpine
    container_name: gfp_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gfp}
      POSTGRES_USER: ${POSTGRES_USER:-gfp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfp}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
